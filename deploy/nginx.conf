# StarNet only answers to Host 127.0.0.1/localhost (its DNS-rebinding guard).
# Traefik + Authelia sit in front of this; here we present every request to
# StarNet as a same-origin loopback request.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  client_max_body_size 200m;
  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8787;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_redirect http://127.0.0.1:8787/ /;
    proxy_redirect http://localhost:8787/ /;
  }
}
