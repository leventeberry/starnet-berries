# The VPS stack. Lives at /opt/starnet/compose.yml on the server (keep the two in sync).
# STARNET_IMAGE is pinned in /opt/starnet/.env by the autodeploy timer.
#
# - app:   StarNet (node sidecar/index.js) on 127.0.0.1:8787 in its own netns
# - proxy: nginx in the same netns, as uid 1000 (StarNet only hands its session
#          token to a loopback peer with its own uid), rewriting Host to loopback
# Traefik + Authelia reach the proxy on 172.18.0.1:4320 (product_public gateway),
# so StarNet shares no network with other containers.
name: starnet

services:
  app:
    image: ${STARNET_IMAGE:?set STARNET_IMAGE in .env}
    restart: unless-stopped
    environment:
      # OAuth sign-ins (e.g. Figma) must redirect back to the public site, not the container's loopback.
      STARNET_PUBLIC_ORIGIN: https://starnet.leventeberry.me
    # Secrets the owner creates on the server (never committed), e.g. STARNET_FIGMA_OAUTH_CLIENT_ID/_SECRET.
    # Optional: the stack still starts without it.
    env_file:
      - path: ./figma.env
        required: false
    init: true
    volumes:
      - starnet_home:/home/node
      - /srv/starnet-share:/home/node/shared
    ports:
      - "172.18.0.1:4320:8080"
    networks: [starnet]
    mem_limit: 3g
    cpus: 1.5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    user: "1000:1000"
    restart: unless-stopped
    network_mode: "service:app"
    depends_on: [app]
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs: ["/tmp:uid=1000,gid=1000"]
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  starnet_home:

networks:
  starnet:
